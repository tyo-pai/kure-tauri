      <stop offset="1" stop-color="#e7e1d6"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(726 432) rotate(90) scale(430 560)">
